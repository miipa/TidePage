[package]
name = "tidepage"
version = "0.1.28"
description = "TidePage - a fast local reading app"
authors = ["you"]
edition = "2021"

[lib]
name = "tidepage_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
regex = "1"
fancy-regex = "0.14"
walkdir = "2"
notify = "6"
rayon = "1"
encoding_rs = "0.8"
chardetng = "0.1"
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.36"
mobi = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "socks", "multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
futures-util = "0.3"
trash = "5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
rfd = "0.15"
winreg = "0.55"
base64 = "0.22"
sha2 = "0.10"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
html5ever = "0.39"
tendril = "0.5"
# 便携备份加密：PBKDF2-HMAC-SHA256 派生密钥 + AES-256-GCM 认证加密。
aes-gcm = "0.10"
pbkdf2 = "0.12"
rand = "0.8"

# 凭据加密：调用 Windows DPAPI（CryptProtectData/CryptUnprotectData）以当前用户
# 密钥加密敏感配置。仅 Windows 目标编译该依赖（本应用仅发布 Windows）。
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Security_Cryptography",
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    # 超大 PDF 的原生渲染通道（Windows.Data.Pdf）：pdf.js 对 >2GiB 的文件无解，见 pdfnative.rs
    "Foundation",
    "Data_Pdf",
    "Storage",
    "Storage_Streams",
    "Graphics_Imaging",
    "Win32_System_WinRT",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
